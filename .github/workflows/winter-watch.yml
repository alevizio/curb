name: winter-watch
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.city, inputs.test && 'test email' || 'manual check') || (github.event.schedule == '7,37 * * 11,12,1,2,3,4 *' && 'toronto watch' || 'madison watch') }}

# A city's winter rule that the City turns on by announcement follows CURB's switch (data/<id>/winter.json), flipped by hand
# on the City's news. This reads each City's news and emails the owner when a notice about it appears
# (scripts/cities/winter-watch.mjs). It never flips the switch itself: the owner says "Madison winter on" ("Toronto winter
# on", "Toronto winter off"), or runs scripts/cities/winter.mjs and pushes. What was already emailed is kept in the Actions
# cache (one file per city), so each notice goes once.
#   Madison: a declared snow emergency or the first general plowing turns alternate side parking on. Every two hours,
#   November to March.
#   Toronto: a Major Snowstorm Condition, declared and ended in news releases on toronto.ca/news, turns the snow route rule
#   on and off. Every 30 minutes, November to April.
on:
  schedule:
    - cron: '17 */2 * 11,12,1,2,3 *'
    - cron: '7,37 * * 11,12,1,2,3,4 *'
  workflow_dispatch:
    inputs:
      city:
        description: 'Which city to read'
        type: choice
        options: [madison, toronto]
        default: madison
      test:
        description: 'Send a sample email now (checks delivery; reads no news)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: read the news and print the email, send nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: winter-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache/restore@v6
        with:
          path: .winter-watch
          key: winter-watch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: winter-watch-
      - name: Read Madison's news
        if: github.event.schedule == '17 */2 * 11,12,1,2,3 *' || (github.event_name == 'workflow_dispatch' && inputs.city == 'madison')
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCH_TO: ${{ secrets.WEEKLY_TO }}
          FLAGS: ${{ github.event_name == 'workflow_dispatch' && (inputs.test && '--test' || (inputs.dry_run && '--dry-run' || '')) || '' }}
        run: node scripts/cities/winter-watch.mjs madison --seen .winter-watch/seen.json $FLAGS
      - name: Read Toronto's news
        if: github.event.schedule == '7,37 * * 11,12,1,2,3,4 *' || (github.event_name == 'workflow_dispatch' && inputs.city == 'toronto')
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCH_TO: ${{ secrets.WEEKLY_TO }}
          FLAGS: ${{ github.event_name == 'workflow_dispatch' && (inputs.test && '--test' || (inputs.dry_run && '--dry-run' || '')) || '' }}
        run: node scripts/cities/winter-watch.mjs toronto --seen .winter-watch/seen-toronto.json $FLAGS
      # a real check keeps what it emailed (each city's file, in the one cache); a test or a dry run reads that memory but
      # never replaces it
      - uses: actions/cache/save@v6
        if: always() && hashFiles('.winter-watch/*.json') != '' && (github.event_name == 'schedule' || (!inputs.test && !inputs.dry_run))
        with:
          path: .winter-watch
          key: winter-watch-${{ github.run_id }}-${{ github.run_attempt }}
