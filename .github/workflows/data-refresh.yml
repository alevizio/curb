# Monthly refresh of the precomputed data assets (data/*.json).
#
# Rebuilds the citywide overview, meter/loading zones, white (passenger/loading) curb
# zones, the /tickets stats, and the baked block schedules (data/schedules.json, which the
# /b/ pages read instead of calling DataSF) from their live sources,
# validates the shapes (scripts/validate-data.mjs — fails loudly if a Socrata/ArcGIS
# source changed), and commits only if something actually changed. The commit pushes
# to main, which Vercel auto-deploys.
#
# A failed run opens one alert issue (label monitor:data) and wakes the on-call Claude routine, like the
# monitor's checks (docs/on-call.md); the next good run closes it.
#
# Manual run: Actions tab → "data-refresh" → Run workflow.
name: data-refresh

on:
  schedule:
    - cron: "17 9 1 * *" # 09:17 UTC on the 1st of each month (off the top of the hour)
  workflow_dispatch: {}

# Need write access to commit the refreshed assets back to the repo.
permissions:
  contents: write
  issues: write   # the monitor:data alert issue

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # full history: the sitemaps date each page by its last commit (scripts/lastmod.mjs)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        id: install
        run: npm ci

      # Each build hits live DataSF/ArcGIS. They're independent; run sequentially so a
      # failure points at one source. `set -e` (default) aborts the job on any non-zero.
      # NOTE: build:enforcement is intentionally excluded — it reads the non-redistributable
      # SFMTA citations xlsx (records #26-5453) from a local path, so it only runs on
      # Alejandro's machine; data/enforcement.json is rebuilt + committed by hand.
      - name: Rebuild data assets
        id: build
        run: |
          npm run build:overview
          npm run build:zones
          npm run build:whitezones
          npm run build:stats
          npm run build:schedules

      - name: Validate shapes (fail loudly on source drift)
        id: validate
        run: npm run validate:data

      # Regenerate the neighborhood map snapshots (from the fresh overview.json),
      # then the SEO pages + sitemap from the fresh stats.json, then the block sitemap
      # (lastmods from the fresh schedules.json).
      - name: Rebuild neighborhood maps + pages
        id: pages
        run: |
          npm run build:hoodmaps
          npm run build:hoodpages
          npm run build:blocksitemap

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # _meta.generated carries a fresh timestamp every run, and the daily citation/
          # zone sources almost always move, so in practice this commits each month. The
          # guard is here only for the rare no-op (e.g. a re-run minutes apart).
          git add data/*.json n/ index.html sitemap.xml sitemap-blocks.xml
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          stamp=$(date -u +%Y-%m-%d)
          git commit -m "chore(data): monthly refresh ${stamp}

          Automated rebuild of overview/zones/white-zones/stats from live
          sources, shape-validated by scripts/validate-data.mjs."
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed refreshed data — Vercel will redeploy."

      # Optional: tell IndexNow (Bing & co., free) which URLs got a new sitemap <lastmod>. Waits
      # until Vercel serves the new sitemaps so crawlers don't fetch the old pages; never fails the job.
      - name: Notify IndexNow
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          for i in $(seq 1 40); do
            if curl -fsS https://curb.guide/sitemap.xml | cmp -s - sitemap.xml &&
               curl -fsS https://curb.guide/sitemap-blocks.xml | cmp -s - sitemap-blocks.xml; then
              npm run indexnow -- --since HEAD~1
              exit 0
            fi
            sleep 15
          done
          echo "New sitemaps not live after 10 min — skipping IndexNow."
          exit 1

      # The run as a monitor result (scripts/monitor/refresh-results.mjs): a failure opens one alert issue and
      # wakes the on-call routine; the next good refresh closes the issue. No secrets reach the public issue.
      - name: Results for the alert
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/monitor/refresh-results.mjs refresh.json
      - name: Open / update / close the alert issue
        id: refresh_alert
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/monitor/alert.mjs refresh.json monitor:data "curb.guide data refresh failed"
      - name: Wake the on-call Claude routine (monitor:data)
        if: always() && (steps.refresh_alert.outputs.action == 'open' || steps.refresh_alert.outputs.action == 'comment')
        env:
          CURB_ROUTINE_URL: ${{ secrets.CURB_ROUTINE_URL }}
          CURB_ROUTINE_TOKEN: ${{ secrets.CURB_ROUTINE_TOKEN }}
          ISSUE_URL: ${{ steps.refresh_alert.outputs.issue }}
        run: node scripts/monitor/notify-claude.mjs refresh.json monitor:data "curb.guide data refresh failed"
